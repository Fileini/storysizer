<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta http-equiv="Cache-Control" content="no-store" />

<!-- Open Graph / WhatsApp -->
<meta property="og:title" content="StorySizer">
<meta property="og:description" content="Scrivi e gestisci le tue storie in modo semplice.">
<meta property="og:image" content="https://app.storysizer.org/icons/logo.png">
<meta property="og:url" content="https://app.storysizer.org">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="StorySizer">
<meta name="twitter:description" content="Scrivi e gestisci le tue storie in modo semplice.">
<meta name="twitter:image" content="https://app.storysizer.org/icons/logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="storysizer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>storysizer</title>
  <link rel="manifest" href="manifest.json">
  <script src="js/keycloak.umd.js"></script>
</head>
<body>
  <!-- LinkedIn in-app browser SSO fix (iOS + Android) -->
<script>
  (function() {
    var ua = navigator.userAgent || '';
    var isLinkedIn = /LinkedInApp/i.test(ua) || /liinternal/i.test(ua);
    if (!isLinkedIn) return;
  
    var href = window.location.href;
  
    function writeInterstitial(msg, extraHtml) {
      document.open();
      document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open in browser</title>');
      document.write('<style>body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0b1020;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;} .card{max-width:540px;padding:24px;border-radius:16px;background:#141a2b;box-shadow:0 10px 30px rgba(0,0,0,.35)} h1{font-size:22px;margin:0 0 8px} p{margin:0 0 16px;line-height:1.5;color:#cbd5e1} .btn{display:inline-block;padding:12px 16px;border-radius:10px;border:0;background:#2563eb;color:#fff;text-decoration:none;font-weight:600} .muted{font-size:13px;color:#94a3b8;margin-top:8px} code{word-break:break-all}</style></head><body>');
      document.write('<div class="card"><h1>Open StorySizer in your browser</h1><p>'+ msg +'</p>' + (extraHtml||'') + '<p class="muted">If nothing happens, tap the top-right ... button and choose open in browser or copy & paste this URL in Safari/Chrome:<br><code>'+ href +'</code></p></div>');
      document.write('</body></html>');
      document.close();
    }
  
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
  
    if (isIOS) {
      var m = ua.match(/OS (\d+)_/i);
      var major = m && m[1] ? parseInt(m[1],10) : 0;
      var supportsXSafari = major >= 17;
  
      if (supportsXSafari) {
        // Prova ad aprire in Safari; se resta qui, mostra fallback
        setTimeout(function() {
          writeInterstitial(
            'LinkedIn\'s in-app browser blocks Google sign-in. Tap button below to continue in Safari. ',
            '<p><a class="btn" href="x-safari-'+ href +'">Continue in Safari</a></p>'
          );
        }, 1200);
        location.href = 'x-safari-' + href;
      } else {
        // iOS < 17: niente x-safari affidabile
        writeInterstitial(
          'LinkedIn\'s in-app browser blocks Google sign-in. Open this page in Safari.',
          '<p>Tap ••• then <b>"Open in Safari"</b>.</p>'
        );
      }
      return;
    }
  
    if (isAndroid) {
      // Prova a forzare Chrome; fallback se non va
      var intentUrl = 'intent://' + href.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
      var timer = setTimeout(function(){
        writeInterstitial(
          'LinkedIn\'s in-app browser may block Google sign-in. Open this page in Chrome.',
          '<p><a class="btn" href="'+ href +'" target="_blank" rel="noopener">Open in browser</a></p>'
        );
      }, 1200);
  
      try { location.href = intentUrl; }
      catch(e) {
        clearTimeout(timer);
        writeInterstitial(
          'Open this page in Chrome.',
          '<p><a class="btn" href="'+ href +'" target="_blank" rel="noopener">Open in browser</a></p>'
        );
      }
      return;
    }
  })();
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
