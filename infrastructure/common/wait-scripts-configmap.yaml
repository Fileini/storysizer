# Wait scripts ConfigMap for init containers
# Deploy to each namespace that needs it, or to a shared namespace
#
# Usage in init container:
#   initContainers:
#   - name: wait-for-postgres
#     image: busybox:1.36
#     command: ['sh', '/scripts/wait-for-postgres.sh']
#     args: ['postgres.database.svc.cluster.local', '5432', '300']
#     volumeMounts:
#     - name: wait-scripts
#       mountPath: /scripts
#   volumes:
#   - name: wait-scripts
#     configMap:
#       name: wait-scripts
#       defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wait-scripts
  labels:
    app.kubernetes.io/part-of: storysizer
    app.kubernetes.io/component: startup-ordering
data:
  wait-for-postgres.sh: |
    #!/bin/sh
    # Wait for PostgreSQL to be ready
    # Usage: wait-for-postgres.sh <host> <port> <timeout_seconds>
    set -e
    
    HOST="${1:-postgres}"
    PORT="${2:-5432}"
    TIMEOUT="${3:-300}"
    
    echo "Waiting for PostgreSQL at $HOST:$PORT (timeout: ${TIMEOUT}s)..."
    
    ELAPSED=0
    while [ $ELAPSED -lt $TIMEOUT ]; do
      if nc -z "$HOST" "$PORT" 2>/dev/null; then
        echo "PostgreSQL is ready after ${ELAPSED}s!"
        exit 0
      fi
      echo "PostgreSQL not ready yet... (${ELAPSED}s elapsed)"
      sleep 5
      ELAPSED=$((ELAPSED + 5))
    done
    
    echo "ERROR: PostgreSQL did not become ready within ${TIMEOUT}s"
    exit 1

  wait-for-http.sh: |
    #!/bin/sh
    # Wait for HTTP endpoint to respond with 2xx/3xx
    # Usage: wait-for-http.sh <url> <timeout_seconds>
    set -e
    
    URL="${1}"
    TIMEOUT="${2:-300}"
    
    if [ -z "$URL" ]; then
      echo "ERROR: URL is required"
      echo "Usage: wait-for-http.sh <url> <timeout_seconds>"
      exit 1
    fi
    
    echo "Waiting for HTTP endpoint $URL (timeout: ${TIMEOUT}s)..."
    
    ELAPSED=0
    while [ $ELAPSED -lt $TIMEOUT ]; do
      # Use wget since busybox doesn't have curl
      # -q quiet, -O- output to stdout, -T timeout per request
      HTTP_CODE=$(wget -q -O /dev/null -S --spider -T 5 "$URL" 2>&1 | grep "HTTP/" | tail -1 | awk '{print $2}' || echo "000")
      
      if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 400 ] 2>/dev/null; then
        echo "HTTP endpoint is ready (status: $HTTP_CODE) after ${ELAPSED}s!"
        exit 0
      fi
      
      echo "HTTP endpoint not ready yet (status: $HTTP_CODE)... (${ELAPSED}s elapsed)"
      sleep 5
      ELAPSED=$((ELAPSED + 5))
    done
    
    echo "ERROR: HTTP endpoint did not become ready within ${TIMEOUT}s"
    exit 1

  wait-for-keycloak.sh: |
    #!/bin/sh
    # Wait for Keycloak OIDC discovery endpoint
    # Usage: wait-for-keycloak.sh <keycloak_url> <realm> <timeout_seconds>
    set -e
    
    KEYCLOAK_URL="${1:-https://auth.storysizer.org}"
    REALM="${2:-storysizer}"
    TIMEOUT="${3:-300}"
    
    OIDC_URL="${KEYCLOAK_URL}/realms/${REALM}/.well-known/openid-configuration"
    
    echo "Waiting for Keycloak OIDC at $OIDC_URL (timeout: ${TIMEOUT}s)..."
    
    ELAPSED=0
    while [ $ELAPSED -lt $TIMEOUT ]; do
      # Try to fetch OIDC config, look for "issuer" in response
      if wget -q -O - --no-check-certificate -T 5 "$OIDC_URL" 2>/dev/null | grep -q "issuer"; then
        echo "Keycloak OIDC is ready after ${ELAPSED}s!"
        exit 0
      fi
      
      echo "Keycloak OIDC not ready yet... (${ELAPSED}s elapsed)"
      sleep 5
      ELAPSED=$((ELAPSED + 5))
    done
    
    echo "ERROR: Keycloak OIDC did not become ready within ${TIMEOUT}s"
    exit 1

  wait-for-tcp.sh: |
    #!/bin/sh
    # Wait for TCP port to be open
    # Usage: wait-for-tcp.sh <host> <port> <timeout_seconds>
    set -e
    
    HOST="${1}"
    PORT="${2}"
    TIMEOUT="${3:-300}"
    
    if [ -z "$HOST" ] || [ -z "$PORT" ]; then
      echo "ERROR: Host and port are required"
      echo "Usage: wait-for-tcp.sh <host> <port> <timeout_seconds>"
      exit 1
    fi
    
    echo "Waiting for TCP $HOST:$PORT (timeout: ${TIMEOUT}s)..."
    
    ELAPSED=0
    while [ $ELAPSED -lt $TIMEOUT ]; do
      if nc -z "$HOST" "$PORT" 2>/dev/null; then
        echo "TCP port is ready after ${ELAPSED}s!"
        exit 0
      fi
      echo "TCP port not ready yet... (${ELAPSED}s elapsed)"
      sleep 5
      ELAPSED=$((ELAPSED + 5))
    done
    
    echo "ERROR: TCP port did not become ready within ${TIMEOUT}s"
    exit 1
