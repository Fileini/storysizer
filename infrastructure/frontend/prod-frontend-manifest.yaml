# Frontend Deployment with readiness probe
# No init container - frontend can show "connecting..." if API not ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storysizer-web
  namespace: frontend-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storysizer-web
  template:
    metadata:
      labels:
        app: storysizer-web
    spec:
      priorityClassName: application-standard
      containers:
        - name: storysizer-web
          image: fileini/storysizer-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # Probes for nginx
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storysizer-web
  namespace: frontend-prod
spec:
  selector:
    app: storysizer-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storysizer-web-ingress
  namespace: frontend-prod
  # annotations:
  #   traefik.ingress.kubernetes.io/router.middlewares: frontend-prod-spa-rewrite@kubernetescrd
spec:
  ingressClassName: traefik-public
  rules:
    - host: storysizer.public.cluster.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storysizer-web
                port:
                  number: 80
    - host: app.storysizer.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storysizer-web
                port:
                  number: 80
  tls:
    # 1) certificato interno già esistente (ok tenerlo)
    - hosts:
        - storysizer.public.cluster.local.com
      secretName: wildcard-public-cluster-tls
    # 2) certificato Cloudflare Origin per l'host pubblico
    - hosts:
        - app.storysizer.org
      secretName: storysizer-org-tls
