apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: service-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: fileini/graphql-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
            - containerPort: 5005  # Porta per il debug remoto
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: "https://auth.storysizer.org/realms/storysizer"
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: service-prod
spec:
  selector:
    app: gateway-service
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: service-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Origin: "*"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, OPTIONS"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Headers: "Content-Type, Authorization, X-Requested-With, Accept"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Credentials: "true"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Max-Age: "3600"
spec:
  ingressClassName: traefik-public
  rules:
    - host: api.storysizer.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 9090
  tls:
    - hosts:
        - api.storysizer.org
      secretName: gateway-tls   # copia del keycloak-tls
