apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: service-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      priorityClassName: application-standard
      # Init container: wait for Keycloak OIDC endpoint before starting
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ['sh', '/scripts/wait-for-keycloak.sh']
          args: ['https://auth.storysizer.org', 'storysizer', '300']
          volumeMounts:
            - name: wait-scripts
              mountPath: /scripts
      containers:
        - name: gateway-service
          image: fileini/graphql-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
            - containerPort: 5005  # Porta per il debug remoto
          env:
            - name: KEYCLOAK_ISSUER_URI
              value: "https://auth.storysizer.org/realms/storysizer"
            - name: KEYCLOAK_ADMIN_BASE_URL
              value: "https://auth.storysizer.org"
            - name: KEYCLOAK_REALM
              value: "storysizer"
            - name: KEYCLOAK_ADMIN_REALM
              value: "master"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "admin-cli"
            - name: KEYCLOAK_GOOGLE_PROVIDER_ALIAS
              value: "google"
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-creds
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
          # Probes for Spring Boot Actuator
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # 30 * 5s = 150s max startup
      volumes:
        - name: wait-scripts
          configMap:
            name: wait-scripts
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: service-prod
spec:
  selector:
    app: gateway-service
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: service-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Origin: "*"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, OPTIONS"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Headers: "Content-Type, Authorization, X-Requested-With, Accept"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Allow-Credentials: "true"
    traefik.ingress.kubernetes.io/headers.customResponseHeaders.Access-Control-Max-Age: "3600"
spec:
  ingressClassName: traefik-public
  rules:
    - host: api.storysizer.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 9090
  tls:
    - hosts:
        - api.storysizer.org
      secretName: gateway-tls   # copia del keycloak-tls
