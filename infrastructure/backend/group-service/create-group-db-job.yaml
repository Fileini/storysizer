# Prerequisiti:
#   1. groups-db-secret deve essere presente in service-prod
#   2. microservices-postgres-secret deve essere presente in service-prod
#      (si trova nel namespace 'database' — copiarlo con:
#       kubectl get secret microservices-postgres-secret -n database -o json \
#         | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.annotations) | .metadata.namespace="service-prod"' \
#         | kubectl apply -f -)
apiVersion: batch/v1
kind: Job
metadata:
  name: create-group-db
  namespace: service-prod
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-db
          image: postgres:15
          command:
            - sh
            - -c
            - |
              set -eu
              # ON_ERROR_STOP: fa fallire psql al primo errore SQL invece di tornare 0
              export PSQL_OPTS="-v ON_ERROR_STOP=1"
              CONN="host=postgres.database.svc.cluster.local port=5432 user=${PG_ADMIN_USER} dbname=postgres"

              # Verifica connettivita' e auth prima di tutto
              psql $PSQL_OPTS "$CONN" -c "SELECT 1" >/dev/null

              # Create user if not exists (idempotent)
              if psql $PSQL_OPTS "$CONN" -tAc "SELECT 1 FROM pg_roles WHERE rolname='${NEW_USER}'" | grep -q 1; then
                echo "User '${NEW_USER}' already exists."
              else
                psql $PSQL_OPTS "$CONN" -c "CREATE USER \"${NEW_USER}\" WITH PASSWORD '${NEW_PASSWORD}'"
              fi

              # Create database if not exists (idempotent)
              if psql $PSQL_OPTS "$CONN" -tAc "SELECT 1 FROM pg_database WHERE datname='${NEW_DB}'" | grep -q 1; then
                echo "Database '${NEW_DB}' already exists."
              else
                psql $PSQL_OPTS "$CONN" -c "CREATE DATABASE \"${NEW_DB}\" OWNER \"${NEW_USER}\""
              fi

              echo "Done: database '${NEW_DB}' and user '${NEW_USER}' are ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-postgres-secret
                  key: password
            - name: PG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: microservices-postgres-secret
                  key: username
            - name: NEW_DB
              valueFrom:
                secretKeyRef:
                  name: groups-db-secret
                  key: POSTGRES_DB
            - name: NEW_USER
              valueFrom:
                secretKeyRef:
                  name: groups-db-secret
                  key: POSTGRES_USER
            - name: NEW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: groups-db-secret
                  key: POSTGRES_PASSWORD
