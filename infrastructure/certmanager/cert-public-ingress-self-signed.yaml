apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-public-cert
spec:
  secretName: wildcard-public-cluster-tls
  commonName: "*.public.cluster.local.com"
  duration: 8760h 
  renewBefore: 720h 
  issuerRef:
    name: selfsigned-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - "*.public.cluster.local.com"
