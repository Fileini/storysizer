apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: 2c88d1dc-b80f-4e56-ab73-cd13fe637bd1
    credentials-file: /etc/cloudflared/creds/CREDENTIALS.json

    ingress:
      - hostname: app.storysizer.org
        service: https://traefik-public.ingress.svc.cluster.local:443
        originRequest:
          originServerName: app.storysizer.org
          noTLSVerify: true

      - hostname: auth.storysizer.org
        service: https://traefik-public.ingress.svc.cluster.local:443
        originRequest:
          originServerName: auth.storysizer.org
          noTLSVerify: true

      - hostname: api.storysizer.org
        service: https://traefik-public.ingress.svc.cluster.local:443
        originRequest:
          originServerName: api.storysizer.org
          noTLSVerify: true

      - service: http_status:404
