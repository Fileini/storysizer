apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      priorityClassName: application-standard
      # Init container: wait for Traefik public ingress before starting tunnel
      initContainers:
        - name: wait-for-traefik
          image: busybox:1.36
          command: ['sh', '/scripts/wait-for-tcp.sh']
          args: ['traefik-public.ingress.svc.cluster.local', '443', '300']
          volumeMounts:
            - name: wait-scripts
              mountPath: /scripts
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - "tunnel"
            - "--config"
            - "/etc/cloudflared/config/config.yaml"
            - "--no-autoupdate"
            - "--metrics"
            - "0.0.0.0:2000"
            - "run"
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
            - name: wait-scripts
              mountPath: /scripts
          # Probes using cloudflared metrics endpoint
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-credentials
        - name: wait-scripts
          configMap:
            name: wait-scripts
            defaultMode: 0755
