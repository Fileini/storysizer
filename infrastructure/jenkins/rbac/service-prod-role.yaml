# jenkins-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: service-prod
  name: jenkins-deployer-service
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update","patch", "delete"]
  # per segreto del truststore
- apiGroups: [""]
   resources: ["secrets"]
   resourceNames: ["keycloak-truststore"]   # limita SOLO a quel secret
   verbs: ["get", "create", "update", "patch"]