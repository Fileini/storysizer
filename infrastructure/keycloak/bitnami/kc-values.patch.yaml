# fix tipi che davano nil/wrong type
tls:
  autoGenerated:
    enabled: false
autoscaling:
  hpa:
    enabled: false

# ✅ Init containers completi + resourcesPreset STRINGA
defaultInitContainers:
  prepareWriteDirs:
    enabled: true
    resourcesPreset: "none"
    resources: {}
    containerSecurityContext:
      enabled: true
      runAsUser: 0
  setFilePermissions:
    enabled: true
    resourcesPreset: "none"
    resources: {}
    containerSecurityContext:
      enabled: true
      runAsUser: 0
  mountCustomCerts:
    enabled: false
    resourcesPreset: "none"
    resources: {}
    containerSecurityContext:
      enabled: true
      runAsUser: 1001

# DB: usa subchart e forziamo host
externalDatabase:
  enabled: false
postgresql:
  enabled: true
extraEnvVars:
  - name: KEYCLOAK_DATABASE_HOST
    value: "keycloak-postgresql"
  - name: KEYCLOAK_DATABASE_PORT
    value: "5432"
  - name: POSTGRESQL_HOST
    value: "keycloak-postgresql"
  - name: POSTGRESQL_PORT_NUMBER
    value: "5432"
  - name: KC_DB_URL_HOST
    value: "keycloak-postgresql"
  - name: KC_HTTP_ENABLED
    value: "true"

# proxy/hostname (puoi tenere quelli che avevi già messo)
proxyHeaders: "xforwarded"
hostname: auth.storysizer.org
hostnameStrict: false

# Ingress pubblico (se lo gestisci dal chart)
ingress:
  extraHosts:
    - name: auth.storysizer.org
      path: /
  extraTls:
    - hosts: [auth.storysizer.org]
      secretName: keycloak-tls
