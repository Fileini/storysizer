# Startup ordering: Keycloak is infrastructure-critical (needed by gateway)
priorityClassName: infrastructure-critical

image:
  registry: docker.io
  repository: bitnami/keycloak
  tag: 26.3.3-debian-12-r0
  pullPolicy: IfNotPresent

auth:
  ## @param auth.adminUser Keycloak administrator user
  ##
  adminUser: user
  ## @param auth.adminPassword Keycloak administrator password for the new user
  ##
  adminPassword: ""
  ## @param auth.existingSecret Existing secret containing Keycloak admin password
  ##

adminRealm: "master"
production: true
proxy: "edge"
httpRelativePath: "/"

# PostgreSQL integrato
postgresql:
  enabled: true
  auth:
    postgresPassword: REDACTED_ADMIN_PASSWORD   # superuser postgres
    username: bn_keycloak              # utente usato da Keycloak
    password: REDACTED_DB_PASSWORD        # password utente Keycloak
    database: bitnami_keycloak

ingress:
  enabled: true
  ingressClassName: traefik-public
  hostname: auth.storysizer.org
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod  
    traefik.ingress.kubernetes.io/service.serversscheme: https
    # collega un ServersTransport che imposta SNI = auth.storysizer.org
    traefik.ingress.kubernetes.io/service.serverstransport: keycloak-keycloak-backend-tls@kubernetescrd
    # (opzionale) forza l’entrypoint TLS pubblico di Traefik
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure    kubernetes.io/ingress.class: traefik-public
  # Keep TLS secret explicit to avoid fallback to <hostname>-tls autogenerated names.
  tls: false
  selfSigned: false
  servicePort: https 
  extraTls:
    - hosts:
        - auth.storysizer.org
      secretName: keycloak-tls
  # extraHosts:
  #   - name: keycloak.admin.cluster.local.com
  #     path: /
  # extraTls:
  #   - hosts:
  #       - keyloak.admin.cluster.local.com
  #     secretName: keycloak-tls

# TLS da secret esistente
tls:
  enabled: true
  autoGenerated:
    enabled: false 
  usePemCerts: true
  existingSecret: keycloak-tls
  certFilename: "tls.crt"
  certKeyFilename: "tls.key"

# Variabili extra per Keycloak
extraEnvVars:
  - name: KC_DB_USERNAME
    value: "bn_keycloak"
  - name: KC_DB_PASSWORD
    value: "REDACTED_DB_PASSWORD"
  - name: KC_HOSTNAME
    value: "https://auth.storysizer.org"
  - name: KC_HOSTNAME_ADMIN
    value: "https://keycloak.admin.cluster.local.com"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  # rimuovi questa per evitare il warning "Hostname v1 ...":
  # - name: KC_HOSTNAME_STRICT_HTTPS
  #   value: "true"
  - name: KC_HTTP_ENABLED
    value: "false"
  - name: KEYCLOAK_DATABASE_HOST
    value: "keycloak-postgresql"
  - name: KEYCLOAK_DATABASE_PORT
    value: "5432"

# Init containers (pulizia permessi)
defaultInitContainers:
  prepareWriteDirs:
    enabled: true
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
  setFilePermissions:
    enabled: true
    containerSecurityContext:
      enabled: true
      runAsUser: 1001

# Monta la password del DB
extraVolumes:
  - name: keycloak-db-secret
    secret:
      secretName: keycloak-postgresql
      items:
        - key: password
          path: db-password

extraVolumeMounts:
  - name: keycloak-db-secret
    mountPath: /opt/bitnami/keycloak/db-secret   
    readOnly: true

