apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  namespace: auth
spec:
  ingressClassName: traefik-public
  rules:
    - host: auth.storysizer.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak          # <-- metti il tuo Service
                port:
                  number: 8080          # <-- o 'name: http' se preferisci
  tls:
    - hosts:
        - auth.storysizer.org
      secretName: keycloak-tls
