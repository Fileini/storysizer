<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GraphiQL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/graphiql@5.2.0/graphiql.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@graphiql/plugin-explorer@5.1.1/dist/style.css">

    <style>html, body, #graphiql { height: 100%; margin: 0; }</style>
  </head>
  <body>
    <div id="graphiql">Loading…</div>

    <script type="module">
      import React from "https://cdn.jsdelivr.net/npm/react@18/+esm";
      import { createRoot } from "https://cdn.jsdelivr.net/npm/react-dom@18/client/+esm";
      import { GraphiQL } from "https://cdn.jsdelivr.net/npm/graphiql@5.2.0/+esm";
      import { createGraphiQLFetcher } from "https://cdn.jsdelivr.net/npm/@graphiql/toolkit@0.21.0/+esm";
      import { ExplorerPlugin } from "https://cdn.jsdelivr.net/npm/@graphiql/plugin-explorer@5.1.1/+esm";

      const fetcher = createGraphiQLFetcher({ url: "/graphql" }); // cambia se necessario
      const explorer = ExplorerPlugin();

      createRoot(document.getElementById("graphiql")).render(
        React.createElement(GraphiQL, {
          fetcher,
          defaultEditorToolsVisibility: true,
          plugins: [explorer]
        })
      );
    </script>
  </body>
</html>
