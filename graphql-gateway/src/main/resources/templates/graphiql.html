<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GraphiQL</title>

    <!-- GraphiQL core (CSS + JS) da cdnjs -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/graphiql/5.2.0/graphiql.min.css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/graphiql/5.2.0/graphiql.min.js"
      defer
    ></script>

    <!-- Plugin Explorer (CSS + UMD) da jsDelivr -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@graphiql/plugin-explorer@5.1.1/dist/style.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@graphiql/plugin-explorer@5.1.1/dist/index.umd.js"
      defer
    ></script>

    <style>
      html, body, #graphiql { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="graphiql">Loading…</div>

    <script type="text/javascript">
      window.addEventListener('DOMContentLoaded', () => {
        // usa il fetcher già incluso nel bundle UMD:
        const fetcher = GraphiQL.createFetcher({
          url: '/graphql',                 // <-- endpoint del tuo gateway
          headers: async () => {
            // opzionale: forward del bearer token dal browser
            const token = localStorage.getItem('id_token');
            return token ? { Authorization: `Bearer ${token}` } : {};
          },
          // opzionale: websocket/subscriptions:
          // subscriptionUrl: 'wss://api.storysizer.public.cluster.local.com/graphql',
        });

        // istanzia il plugin explorer (UMD global)
        const explorerPlugin = GraphiQLPluginExplorer.explorerPlugin();

        const root = React.createElement(GraphiQL, {
          fetcher,
          plugins: [explorerPlugin],
          defaultEditorToolsVisibility: true,
        });

        const container = document.getElementById('graphiql');
        ReactDOM.createRoot(container).render(root);
      });
    </script>
  </body>
</html>
